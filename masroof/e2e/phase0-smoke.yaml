# Phase 0 smoke: boots the encrypted DB, renders EN, switches to AR.
# Requires a development or release build (SQLCipher is not in Expo Go).
appId: app.masroof
---
- launchApp:
    clearState: true
- assertVisible: 'Masroof'
- assertVisible: 'No transactions yet'
- tapOn: 'Settings'
- tapOn: 'العربية'
- assertVisible: 'Restart required|يلزم إعادة التشغيل'
- tapOn: 'Restart now|أعد التشغيل الآن'
- assertVisible: 'مصروف'
- assertVisible: 'لا توجد معاملات بعد'
