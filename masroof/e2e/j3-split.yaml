# J3: $123 split into Clothes 80 + Kids 43.
appId: app.masroof
---
- runFlow: flows/_onboard-skip.yaml
- tapOn: 'Add transaction'
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: 'Clothes'
- tapOn:
    id: split-toggle
- tapOn:
    id: split-amount-0
- eraseText
- inputText: '80'
- tapOn:
    text: 'Kids'
    index: 1
- tapOn:
    id: split-amount-1
- inputText: '40'
- assertVisible: 'Remaining: 3.00.*'
- assertVisible:
    id: save
    enabled: false
- tapOn:
    id: split-amount-1
- eraseText
- inputText: '43'
- assertVisible: '.*Fully split'
- tapOn:
    id: save
- assertVisible: 'Clothes'
- assertVisible: 'Kids'
